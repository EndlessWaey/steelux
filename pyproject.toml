[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


[project]
name = "SteeLux"
version = "0.1.0"
description = "Configure SteelSeries mice on Linux!"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pyusb>=1.2.1",
]

[project.scripts]
steelux = "run:main"